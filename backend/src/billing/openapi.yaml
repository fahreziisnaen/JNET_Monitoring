openapi: 3.1.0
info:
  title: JNET Monitoring — Billing API
  version: 0.1.0
  description: |
    Kontrak API modul **Billing** (pembayaran pelanggan ISP) yang berjalan di
    dalam backend JNET Monitoring. Hanya modul billing yang didokumentasikan di sini.

    ## Autentikasi
    - **customerAuth** — JWT pelanggan (klaim `aud: billing-customer`), didapat dari
      `POST /customer/auth/verify-otp`. Dikirim via `Authorization: Bearer <token>`
      (atau cookie `billing_token`). Dipakai aplikasi billing (React Native).
    - **adminAuth** — JWT admin existing JNET Monitoring (`protect` + `authorizeAdmin`).
      Token pelanggan & admin TIDAK saling bisa dipakai (audience berbeda).
    - **Webhook** tidak pakai bearer; keamanannya dari signature HMAC-SHA256
      (`X-Callback-Signature`).
  contact:
    name: JNET Monitoring
servers:
  - url: /api/billing
    description: Relatif terhadap host backend (mis. https://monitor.domain.com)

tags:
  - name: Customer Auth
    description: Login pelanggan via OTP WhatsApp
  - name: Customer Portal
    description: Data milik pelanggan sendiri (langganan, invoice, pembayaran)
  - name: Admin
    description: Manajemen paket, pelanggan, langganan, invoice, pengaturan
  - name: Webhook
    description: Callback payment gateway (Tripay)

paths:
  # ============================ CUSTOMER AUTH ============================
  /customer/auth/request-otp:
    post:
      tags: [Customer Auth]
      summary: Minta OTP login via WhatsApp
      description: |
        Mengirim OTP ke nomor WhatsApp pelanggan yang sudah terdaftar (oleh admin).
        Respons selalu generik agar tidak membocorkan nomor mana yang terdaftar.
        Jika gateway WhatsApp mati, balas 503 (TIDAK ada bypass).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp_number]
              properties:
                whatsapp_number:
                  type: string
                  example: "081234567890"
      responses:
        '200':
          description: OTP dikirim (atau nomor tidak terdaftar — respons sama)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Akun pelanggan nonaktif, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '503': { description: Layanan WhatsApp tidak tersedia, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  /customer/auth/verify-otp:
    post:
      tags: [Customer Auth]
      summary: Verifikasi OTP & login
      description: Memverifikasi OTP, membuat sesi, dan mengembalikan token JWT pelanggan (berlaku 30 hari). Juga men-set cookie `billing_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [whatsapp_number, otp]
              properties:
                whatsapp_number: { type: string, example: "081234567890" }
                otp: { type: string, example: "123456" }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string, description: JWT pelanggan }
                  customer:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string, nullable: true }
                      whatsapp_number: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: OTP salah atau kedaluwarsa, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/auth/logout:
    post:
      tags: [Customer Auth]
      summary: Logout (revoke sesi)
      security: [{ customerAuth: [] }]
      responses:
        '200': { description: Logout berhasil, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /customer/me:
    get:
      tags: [Customer Auth]
      summary: Profil pelanggan saat ini
      security: [{ customerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ CUSTOMER PORTAL ============================
  /customer/subscription:
    get:
      tags: [Customer Portal]
      summary: Langganan & paket aktif milik pelanggan
      security: [{ customerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    oneOf:
                      - $ref: '#/components/schemas/SubscriptionWithPackage'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /customer/invoices:
    get:
      tags: [Customer Portal]
      summary: Daftar invoice milik pelanggan
      security: [{ customerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /customer/invoices/{id}:
    get:
      tags: [Customer Portal]
      summary: Detail invoice + riwayat pembayaran
      security: [{ customerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/invoices/{id}/pay:
    post:
      tags: [Customer Portal]
      summary: Buat transaksi pembayaran untuk invoice
      description: |
        Membuat transaksi di payment gateway. Jika sudah ada pembayaran `pending`,
        transaksi itu dikembalikan (idempoten). Bila gateway belum dikonfigurasi,
        dikembalikan transaksi mode simulasi (`simulated: true`).
      security: [{ customerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, description: Channel pembayaran (mis. QRIS, BRIVA), opsional }
      responses:
        '200': { description: Transaksi pending sudah ada, content: { application/json: { schema: { type: object, properties: { message: { type: string }, payment: { $ref: '#/components/schemas/Payment' } } } } } }
        '201':
          description: Transaksi dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  payment:
                    type: object
                    properties:
                      id: { type: integer }
                      merchant_ref: { type: string }
                      checkout_url: { type: string, nullable: true }
                      pay_code: { type: string, nullable: true }
                      expired_at: { type: string, format: date-time, nullable: true }
                      simulated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Gagal membuat transaksi di gateway, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  # ============================ ADMIN: PAKET ============================
  /admin/packages:
    get:
      tags: [Admin]
      summary: Daftar paket
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceOverride' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { packages: { type: array, items: { $ref: '#/components/schemas/Package' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Buat paket
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/packages/{id}:
    put:
      tags: [Admin]
      summary: Perbarui paket
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Hapus paket
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Paket masih dipakai langganan, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  # ============================ ADMIN: PELANGGAN ============================
  /admin/customers:
    get:
      tags: [Admin]
      summary: Daftar pelanggan billing
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceOverride' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { customers: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Buat pelanggan billing
      description: Bisa otomatis menautkan ke `clients` existing via `client_id` (mewarisi nama, secret PPPoE, device).
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Nomor WhatsApp sudah terdaftar, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }

  /admin/customers/{id}:
    put:
      tags: [Admin]
      summary: Perbarui pelanggan
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ ADMIN: LANGGANAN ============================
  /admin/subscriptions:
    get:
      tags: [Admin]
      summary: Daftar langganan
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceOverride' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { subscriptions: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Buat langganan (pelanggan ↔ paket)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, package_id]
              properties:
                customer_id: { type: integer }
                package_id: { type: integer }
                start_date: { type: string, format: date }
                due_day_of_month: { type: integer, minimum: 1, maximum: 28, default: 1 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/subscriptions/{id}:
    put:
      tags: [Admin]
      summary: Perbarui langganan
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: { type: integer }
                status: { type: string, enum: [active, suspended, cancelled] }
                due_day_of_month: { type: integer, minimum: 1, maximum: 28 }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ ADMIN: INVOICE ============================
  /admin/invoices:
    get:
      tags: [Admin]
      summary: Daftar invoice (filter status/tahun/bulan)
      security: [{ adminAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WorkspaceOverride' }
        - { name: status, in: query, schema: { type: string, enum: [unpaid, paid, overdue, void] } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/invoices/generate:
    post:
      tags: [Admin]
      summary: Generate invoice (idempotent) untuk semua langganan aktif
      security: [{ adminAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                year: { type: integer, description: Default tahun berjalan }
                month: { type: integer, minimum: 1, maximum: 12, description: Default bulan berjalan }
      responses:
        '200':
          description: Ringkasan generate
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  summary:
                    type: object
                    properties:
                      workspaceId: { type: integer }
                      year: { type: integer }
                      month: { type: integer }
                      total: { type: integer }
                      created: { type: integer }
                      skipped: { type: integer }
                      invoiceIds: { type: array, items: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ ADMIN: SETTINGS ============================
  /admin/settings:
    get:
      tags: [Admin]
      summary: Ambil pengaturan billing (kunci gateway di-mask)
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WorkspaceOverride' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { settings: { oneOf: [ { $ref: '#/components/schemas/Settings' }, { type: 'null' } ] } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Admin]
      summary: Simpan pengaturan billing (upsert)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsInput' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ WEBHOOK ============================
  /webhook/tripay:
    post:
      tags: [Webhook]
      summary: Callback pembayaran Tripay
      description: |
        Dipanggil oleh Tripay saat status transaksi berubah. Body MENTAH
        diverifikasi dengan HMAC-SHA256 menggunakan `tripay_private_key`
        (header `X-Callback-Signature`). Jika `status: PAID`, invoice ditandai
        lunas dan pelanggan otomatis di-unisolir (jika punya secret PPPoE).
      security: []
      parameters:
        - name: X-Callback-Signature
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256(rawBody, tripay_private_key) dalam hex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant_ref: { type: string, example: "PAY-INV-1-202606-5-1718000000000" }
                reference: { type: string, example: "T123456789" }
                status: { type: string, enum: [PAID, EXPIRED, FAILED, REFUND], example: PAID }
      responses:
        '200': { description: Diterima, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { description: Body/merchant_ref tidak valid }
        '403': { description: Signature tidak valid }
        '404': { description: Transaksi tidak ditemukan }

components:
  securitySchemes:
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT pelanggan (aud=billing-customer) dari verify-otp
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT admin JNET Monitoring (role admin/owner/super_admin)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    WorkspaceOverride:
      name: workspaceId
      in: query
      required: false
      schema: { type: integer }
      description: Override workspace (hanya admin/noc/superadmin)

  responses:
    OkMessage:
      description: Berhasil
      content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
    Created:
      description: Dibuat
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              id: { type: integer }
    BadRequest:
      description: Input tidak valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
    Unauthorized:
      description: Tidak terotorisasi / token tidak valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
    NotFound:
      description: Tidak ditemukan
      content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    Customer:
      type: object
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        client_id: { type: integer, nullable: true }
        device_id: { type: integer, nullable: true }
        pppoe_secret_name: { type: string, nullable: true }
        name: { type: string, nullable: true }
        whatsapp_number: { type: string }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive, suspended] }
    CustomerInput:
      type: object
      required: [whatsapp_number]
      properties:
        client_id: { type: integer, nullable: true, description: Tautkan ke clients.id }
        device_id: { type: integer, nullable: true }
        pppoe_secret_name: { type: string, nullable: true }
        name: { type: string }
        whatsapp_number: { type: string }
        email: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, inactive, suspended] }
    Package:
      type: object
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, format: float }
        speed_mbps: { type: integer, nullable: true }
        pppoe_profile: { type: string, nullable: true }
        billing_cycle: { type: string, enum: [monthly] }
        is_active: { type: integer, enum: [0, 1] }
    PackageInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, format: float, minimum: 0 }
        speed_mbps: { type: integer }
        pppoe_profile: { type: string, description: Profil PPPoE yg dipulihkan saat lunas }
        is_active: { type: boolean }
    Subscription:
      type: object
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        customer_id: { type: integer }
        package_id: { type: integer }
        status: { type: string, enum: [active, suspended, cancelled] }
        start_date: { type: string, format: date }
        due_day_of_month: { type: integer }
        next_due_date: { type: string, format: date, nullable: true }
        customer_name: { type: string, nullable: true }
        whatsapp_number: { type: string, nullable: true }
        package_name: { type: string, nullable: true }
        price: { type: number, nullable: true }
    SubscriptionWithPackage:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        start_date: { type: string, format: date }
        due_day_of_month: { type: integer }
        next_due_date: { type: string, format: date, nullable: true }
        package_id: { type: integer }
        package_name: { type: string }
        price: { type: number }
        speed_mbps: { type: integer, nullable: true }
        description: { type: string, nullable: true }
    Invoice:
      type: object
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        subscription_id: { type: integer }
        customer_id: { type: integer }
        invoice_number: { type: string }
        period_year: { type: integer }
        period_month: { type: integer }
        amount: { type: number, format: float }
        due_date: { type: string, format: date }
        status: { type: string, enum: [unpaid, paid, overdue, void] }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        provider: { type: string, example: tripay }
        merchant_ref: { type: string }
        provider_ref: { type: string, nullable: true }
        payment_method: { type: string, nullable: true }
        amount: { type: number, format: float }
        status: { type: string, enum: [pending, paid, failed, expired, refunded] }
        checkout_url: { type: string, nullable: true }
        pay_code: { type: string, nullable: true }
        expired_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
    Settings:
      type: object
      properties:
        workspace_id: { type: integer }
        tripay_merchant_code: { type: string, nullable: true }
        tripay_api_key: { type: string, nullable: true, description: Di-mask saat GET }
        tripay_private_key: { type: string, nullable: true, description: Di-mask saat GET }
        tripay_mode: { type: string, enum: [sandbox, production] }
        invoice_gen_day: { type: integer }
        reminder_days_before: { type: integer }
        grace_days: { type: integer }
        auto_isolir_enabled: { type: integer, enum: [0, 1] }
        isolir_profile: { type: string }
    SettingsInput:
      type: object
      properties:
        tripay_merchant_code: { type: string }
        tripay_api_key: { type: string }
        tripay_private_key: { type: string }
        tripay_mode: { type: string, enum: [sandbox, production] }
        invoice_gen_day: { type: integer, minimum: 1, maximum: 28 }
        reminder_days_before: { type: integer, minimum: 0 }
        grace_days: { type: integer, minimum: 0 }
        auto_isolir_enabled: { type: boolean }
        isolir_profile: { type: string }
